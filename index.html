<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolk! - Minimalist Music</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="output.css" rel="stylesheet">
    

    <style>
        :root {
            --parabola-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background-color: #FCFBF8;
        }

        /* SPA Pages */
        .page {
            display: none;
            opacity: 0;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transition: opacity 0.4s ease;
        }

        .page.active {
            display: block;
            opacity: 1;
        }

        #page-now-playing.active {
            display: flex; /* Special flex layout for now playing */
        }

        /* 
         * The absolute positioned search block. 
         */
        #search-block {
            position: absolute;
            left: 50%;
            top: -20%;
            transform: translate(-50%, -50%);
            opacity: 0;
            width: 100%;
            max-width: 32rem;
            transition: top 1.2s var(--parabola-ease), 
                        transform 1s var(--parabola-ease), 
                        opacity 1s var(--parabola-ease);
            z-index: 20;
        }

        body.is-loaded #search-block {
            top: 50%;
            opacity: 1;
        }

        body.is-searching #search-block {
            top: 25px; 
            transform: translate(-50%, 0);
        }

        /* Large Logo */
        #large-logo-wrapper {
            opacity: 1;
            transition: opacity 0.6s ease-out;
        }
        
        body.is-searching #large-logo-wrapper {
            opacity: 0;
        }

        .logo-inner {
            overflow: hidden;
        }

        /* Small Logo */
        #smallLogo {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.6s var(--parabola-ease), 
                        transform 0.8s var(--parabola-ease);
        }

        /* Show small logo when searching OR when not on search page */
        body.is-searching #smallLogo,
        body:not([data-page="search"]) #smallLogo {
            opacity: 1;
            transform: translateY(0);
        }

        /* Search Results */
        #searchResults {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            margin-top: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.6s var(--parabola-ease), 
                        transform 0.8s var(--parabola-ease),
                        visibility 0s linear 0.8s;
        }

        body.is-searching #searchResults {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.6s var(--parabola-ease), 
                        transform 0.8s var(--parabola-ease),
                        visibility 0s linear 0s;
        }

        /* Bottom Player */
        .player-artist {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            overflow: hidden;
            transition: max-height 0.4s var(--parabola-ease), 
                        opacity 0.4s var(--parabola-ease), 
                        margin-top 0.4s var(--parabola-ease);
        }

        #bottom-player:hover .player-artist {
            max-height: 20px;
            opacity: 1;
            margin-top: 2px;
        }

        /* Hide bottom player on now playing page */
        body[data-page="now-playing"] #bottom-player {
            transform: translate(-50%, 150%);
            opacity: 0;
            pointer-events: none;
        }

        /* Animations */
        .spin-slow {
            animation: spin 20s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* UI general styles */
        .sleek-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sleek-hover:hover { opacity: 0.7; }
        .yolk-active {
            background-color: #18181b;
            color: white;
            box-shadow: 0px 4px 10px rgba(24, 24, 27, 0.15);
        }

        /* Lyrics Styling */
        #lyrics-container {
            scroll-behavior: smooth;
        }
        .lyric-line {
            padding: 10px 20px;
            border-radius: 1.25rem;
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 500;
            color: #a1a1aa;
            cursor: pointer;
            transition: color 0.3s ease, font-size 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            transform-origin: center center;
            max-width: 100%;
            user-select: none;
            -webkit-user-select: none;
        }
        .lyric-line:hover {
            color: #52525b;
            background: rgba(0, 0, 0, 0.025);
        }
        .lyric-line.active {
            color: #18181b;
            font-size: 1.45rem;
            font-weight: 700;
            transform: scale(1.04);
            text-shadow: 0 4px 24px rgba(253, 224, 71, 0.35);
        }
        .lyric-line.untimed {
            color: #3f3f46;
            font-size: 1.05rem;
            font-weight: 500;
            cursor: default;
        }
        .lyric-line.untimed:hover {
            background: transparent;
        }
        .lyric-dots {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
        }
        .lyric-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #d4d4d8;
            transition: transform 0.25s ease, background-color 0.25s ease;
        }
        .lyric-dot.highlight {
            background-color: #18181b;
            transform: scale(1.4);
        }
    </style>
</head>
<body class="text-zinc-800 h-screen w-screen overflow-hidden selection:bg-zinc-200 selection:text-zinc-900 relative" data-page="search">

    <!-- Small Top-Left Logo -->
    <div id="smallLogo" class="fixed top-6 left-8 z-40 flex items-center gap-2 pointer-events-none">
        <div class="w-6 h-6 bg-black rounded-full shadow-sm"></div>
        <span class="text-xl font-bold text-black tracking-tight">Yolk!</span>
    </div>

    <!-- Top Navigation Bar -->
    <header class="fixed top-6 left-1/2 -translate-x-1/2 z-30 flex justify-center w-[calc(100%-3rem)] max-w-fit">
        <nav class="flex gap-1.5 items-center bg-white/70 backdrop-blur-md p-[10px] h-[56px] rounded-full border border-zinc-200 shadow-sm transition-all duration-300">
            <a href="#search" id="nav-search" class="yolk-active text-sm font-medium px-5 h-8 flex items-center justify-center rounded-full sleek-transition">
                Search
            </a>
            <a href="#library" id="nav-library" class="sleek-hover text-sm font-medium px-5 h-8 flex items-center justify-center rounded-full text-zinc-600 sleek-transition">
                Library
            </a>
            <a href="#now-playing" id="nav-now-playing" class="sleek-hover text-sm font-medium px-5 h-8 flex items-center justify-center rounded-full text-zinc-600 sleek-transition">
                Now Playing
            </a>
        </nav>
    </header>

    <!-- ==== PAGE: SEARCH ==== -->
    <div id="page-search" class="page active">
        <!-- Central Search Block -->
        <div id="search-block">
            <!-- Large Logo -->
            <div id="large-logo-wrapper">
                <div class="logo-inner flex flex-col items-center justify-center mb-8">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-black rounded-full shadow-md"></div>
                        <h1 class="text-6xl font-bold text-black tracking-tighter">Yolk!</h1>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="relative w-full z-20">
                <input 
                    id="searchInput"
                    type="text" 
                    placeholder="Search songs, artists, or playlists..." 
                    class="w-full h-[56px] bg-white border border-zinc-200 text-zinc-800 text-base rounded-full px-6 py-[10px] outline-none transition-all duration-300 focus:border-zinc-300 focus:shadow-lg placeholder:text-zinc-400 shadow-sm"
                    autocomplete="off"
                >
                <div class="absolute right-[14px] top-1/2 -translate-y-1/2 text-zinc-400 transition-colors duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
            </div>

            <!-- Search Results -->
            <div id="searchResults" class="flex flex-col gap-3">
                <div class="text-[11px] font-semibold text-zinc-400 uppercase tracking-widest text-left w-full mb-1 pl-5">Top Results</div>
            </div>
        </div>
    </div>

    <!-- ==== PAGE: LIBRARY ==== -->
    <div id="page-library" class="page">
        <main class="w-full h-full pt-32 pb-24 px-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-4xl font-bold tracking-tight mb-8">Your Library</h1>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                </div>
            </div>
        </main>
    </div>

    <!-- ==== PAGE: NOW PLAYING ==== -->
    <div id="page-now-playing" class="page flex-col items-center justify-start px-6 pt-24 pb-32 relative overflow-y-auto">
        <div id="now-playing-art" class="mt-4 w-44 h-44 sm:w-56 sm:h-56 md:w-64 md:h-64 bg-zinc-100 rounded-[2.25rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.12)] border border-zinc-200/60 flex items-center justify-center relative overflow-hidden mb-6 shrink-0 transition-transform duration-500 hover:scale-[1.02]">
            <img id="now-playing-img" src="" alt="Album Art" class="absolute inset-0 w-full h-full object-cover hidden z-10 transition-opacity duration-300" referrerpolicy="no-referrer">
            <div id="now-playing-vinyl" class="w-20 h-20 rounded-full bg-zinc-800 flex items-center justify-center shadow-inner spin-slow z-0">
                <div class="w-7 h-7 rounded-full bg-zinc-100 shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)]"></div>
            </div>
        </div>
        <div class="text-center mb-6 shrink-0 max-w-md w-full px-4">
            <h1 id="now-playing-title" class="text-2xl font-bold tracking-tight text-zinc-900 mb-1 truncate">Not Playing</h1>
            <p id="now-playing-artist" class="text-sm font-medium text-zinc-500 truncate">Select a song to start</p>
        </div>
        <div class="w-full max-w-md flex flex-col gap-2 mb-6 shrink-0">
            <div id="now-playing-progress-bar" class="w-full h-2 bg-zinc-200/80 hover:h-2.5 rounded-full overflow-hidden relative cursor-pointer transition-all">
                <div id="now-playing-progress-fill" class="absolute left-0 top-0 w-0 h-full bg-zinc-900 rounded-full pointer-events-none"></div>
            </div>
            <div class="flex justify-between w-full">
                <span id="now-playing-current-time" class="text-xs text-zinc-400 font-medium select-none">0:00</span>
                <span id="now-playing-duration" class="text-xs text-zinc-400 font-medium select-none">0:00</span>
            </div>
        </div>
        <div class="flex items-center justify-center gap-8 mb-8 shrink-0">
            <button id="now-playing-prev" class="sleek-hover text-zinc-400 hover:text-zinc-800 transition-colors p-2" title="Previous Track">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            <button id="now-playing-play-pause" class="flex items-center justify-center w-14 h-14 rounded-full bg-zinc-900 text-white shadow-lg hover:scale-105 active:scale-95 transition-all" title="Play / Pause">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <button id="now-playing-next" class="sleek-hover text-zinc-400 hover:text-zinc-800 transition-colors p-2" title="Next Track">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>
        
        <!-- Lyrics Container -->
        <div id="lyrics-container" class="w-full max-w-xl text-center pb-24 px-4 flex flex-col items-center gap-2 select-none min-h-[140px]">
        </div>
    </div>

    <!-- Bottom Player Bar (Visible on search and library) -->
    <div id="bottom-player" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-4xl h-[56px] hover:h-[75px] bg-white/80 backdrop-blur-lg border border-zinc-200 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-full p-[12px] box-border flex justify-between items-center z-20 transition-all duration-500 ease-[var(--parabola-ease)] group hidden-force">
        <div class="flex items-center gap-3 w-1/3 min-w-[180px] h-full cursor-pointer" id="bottom-player-info">
            <div class="w-8 h-8 group-hover:w-11 group-hover:h-11 transition-all duration-500 ease-[var(--parabola-ease)] bg-zinc-100 border border-zinc-200 rounded-full shrink-0 flex items-center justify-center shadow-inner overflow-hidden relative">
                <img id="bottom-player-img" src="" alt="Cover" class="w-full h-full object-cover hidden" referrerpolicy="no-referrer">
                <div id="bottom-player-placeholder" class="flex items-center justify-center text-zinc-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-500 group-hover:scale-110"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
            </div>
            <div class="flex flex-col justify-center translate-y-[1px] min-w-0 pr-2">
                <span id="bottom-player-title" class="text-sm font-semibold text-zinc-800 leading-none truncate">Not Playing</span>
                <span id="bottom-player-artist" class="player-artist text-[11px] font-medium text-zinc-500 leading-none truncate mt-0.5">Select a song to start</span>
            </div>
        </div>
        <div class="flex items-center justify-center gap-5 w-1/3">
            <button id="bottom-player-prev" class="sleek-hover text-zinc-400 hover:text-zinc-800 transition-colors p-1" title="Previous Track">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            <button id="bottom-player-play-pause" class="flex items-center justify-center w-9 h-9 group-hover:w-10 group-hover:h-10 rounded-full bg-zinc-900 border border-zinc-800 text-white transition-all duration-500 ease-[var(--parabola-ease)] shadow-md" title="Play / Pause">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="ml-0.5"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
            <button id="bottom-player-next" class="sleek-hover text-zinc-400 hover:text-zinc-800 transition-colors p-1" title="Next Track">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>
        </div>
        <div class="w-1/3 flex justify-end items-center gap-3">
            <div class="w-full max-w-[160px] flex items-center gap-2 group-hover:gap-3 transition-all duration-500">
                <span id="bottom-player-current-time" class="text-[10px] text-zinc-400 font-medium select-none">0:00</span>
                <div id="bottom-player-progress-bar" class="flex-1 h-1 bg-zinc-200 rounded-full overflow-hidden relative cursor-pointer">
                    <div id="bottom-player-progress-fill" class="absolute left-0 top-1/2 -translate-y-1/2 w-0 h-full bg-zinc-800 pointer-events-none"></div>
                </div>
                <span id="bottom-player-duration" class="text-[10px] text-zinc-400 font-medium select-none">0:00</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const searchInput = document.getElementById('searchInput');

            // Initial animation
            setTimeout(() => {
                body.classList.add('is-loaded');
            }, 50); 

            // Search interactions
            searchInput.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    body.classList.add('is-searching');
                } else {
                    body.classList.remove('is-searching');
                }
            });

            // SPA Routing
            const pages = {
                search: document.getElementById('page-search'),
                library: document.getElementById('page-library'),
                'now-playing': document.getElementById('page-now-playing')
            };

            const navLinks = {
                search: document.getElementById('nav-search'),
                library: document.getElementById('nav-library'),
                'now-playing': document.getElementById('nav-now-playing')
            };

            function navigate() {
                let hash = window.location.hash.replace('#', '') || 'search';
                if (!pages[hash]) hash = 'search';

                // Set body data attribute for conditional CSS (like hiding bottom player)
                body.setAttribute('data-page', hash);

                // Update nav links
                Object.keys(navLinks).forEach(key => {
                    if (key === hash) {
                        navLinks[key].className = 'yolk-active text-sm font-medium px-5 h-8 flex items-center justify-center rounded-full sleek-transition';
                    } else {
                        navLinks[key].className = 'sleek-hover text-sm font-medium px-5 h-8 flex items-center justify-center rounded-full text-zinc-600 sleek-transition';
                    }
                });

                // Update pages
                Object.keys(pages).forEach(key => {
                    if (key === hash) {
                        pages[key].classList.add('active');
                        // Small delay to allow display:block to apply before opacity transitions
                        setTimeout(() => pages[key].style.opacity = 1, 10);
                    } else {
                        pages[key].classList.remove('active');
                        pages[key].style.opacity = 0;
                    }
                });
            }

            window.addEventListener('hashchange', navigate);
            navigate(); // Trigger on initial load
        });
    </script>
    <script src="yolk-app.js"></script>
</body>
</html>
